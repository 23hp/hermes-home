---
- name: Set up k8s cluster
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build Infrastructure
      community.general.terraform:
        project_path: "{{ playbook_dir }}"
        state: present
        variables:
          region: "{{ region }}"
          compartment_id: "{{ compartment_id }}"
          cloudflare_token: "{{ cloudflare_token }}"
          ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_rsa.pub') }}"
          k8s_ver: "v1.36.1"
          kube_config_path: "~/.kube/config"
      register: infra_result

    - name: Remove Flux CD from Kubernetes cluster
      ansible.builtin.command: flux uninstall --namespace=flux-system --silent
      tags: [never]

    - name: Create namespace
      kubernetes.core.k8s:
        name: flux-system
        kind: Namespace
        state: present

    - name: Install flux CD
      environment:
        GITHUB_TOKEN: "{{ github_pat }}"
      ansible.builtin.command: |
        flux bootstrap github \
          --owner={{ github_user }} \
          --repository={{ github_repo }} \
          --path={{ github_path }} \
          --personal

    - name: Deploy AGE key for FluxCD
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: flux-system
          stringData:
            age.agekey: "{{ age_key }}"

    - name: Remove default StorageClass (oci-bv) from OKE
      kubernetes.core.k8s:
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: oci-bv
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
        state: patched

    - name: Deploy initial config
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: init-config
            namespace: flux-system
          data:
            domain_name: "{{ domain_name }}"
            public_subnet_id: "{{ infra_result.outputs.public_subnet_id.value }}"
            # reserved_ip_address: "{{ infra_result.outputs.reserved_ip_address.value }}"
            network_security_group_id: "{{ infra_result.outputs.network_security_group_id.value }}"